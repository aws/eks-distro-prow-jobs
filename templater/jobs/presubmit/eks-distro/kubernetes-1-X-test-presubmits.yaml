jobName: kubernetes-{{ .releaseBranch }}-test-presubmit
runIfChanged: projects/kubernetes/kubernetes/{{ .releaseBranch }}/(GIT_TAG|patches|GOLANG_VERSION)
commands:
- make test -C $PROJECT_PATH
projectPath: projects/kubernetes/kubernetes
envVars:
- name: RELEASE_BRANCH
  value: {{ .releaseBranch }}
resources:
  limits:
    cpu: 16
    memory: 32Gi
  requests:
    cpu: 16
    memory: 32Gi
    {{ if or (eq .releaseBranch "1-31") (eq .releaseBranch "1-32") (eq .releaseBranch "1-33") (eq .releaseBranch "1-34") (eq .releaseBranch "1-35") (eq .releaseBranch "1-36") (eq .releaseBranch "1-37")}}
    ephemeral-storage: "50Gi"
    {{ end }}
